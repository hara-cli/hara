name: ci

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ["22.23.1", "24.15.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use the pinned npm publication toolchain
        if: ${{ matrix.node == '24.15.0' }}
        run: npm install --global npm@12.1.0
      - run: npm ci
      - run: npm test
      - name: Smoke the packed npm package in a private installation
        shell: bash
        run: node scripts/npm-package-smoke.mjs --cache "$(npm config get cache)"

  legacy-runtime-message:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Old Node exits with an upgrade instruction
        run: |
          ! node runtime-bootstrap.cjs --version 2>legacy-runtime.err
          grep -q 'requires Node.js 22.23.1 or newer' legacy-runtime.err
          grep -q 'nvm install 22' legacy-runtime.err

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.1"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
          # Use the old-CPU-compatible compiler itself as well as the standalone baseline target.
          bun-download-url: "https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip"
      - run: npm ci
      - name: Build TypeScript
        id: windows-build
        run: npm run build
      - name: Exercise Bun model proxy transport
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        run: bun scripts/model-proxy-runtime-smoke.mjs
      - name: Run Windows Bun filesystem regressions
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        run: bun test test/fs-read.test.mjs test/windows-shell.test.mjs
      # Keep this lane focused on Windows contracts that differ from POSIX: portable/Git-Bash HOME,
      # command-shim resolution, and deterministic shell discovery outside PATH. The complete suite
      # remains in build-test.
      - name: Run Windows contract tests
        shell: pwsh
        run: |
          node --test --test-timeout=120000 test/runtime.test.mjs test/windows-shell.test.mjs test/private-state-portable.test.mjs test/fs-read.test.mjs test/external-agent.test.mjs test/npm-package-smoke.test.mjs test/agent-worktree-registration.test.mjs 2>&1 |
            Tee-Object -Variable captured
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $tail = (($captured | Select-Object -Last 80) -join "`n")
            $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error file=.github/workflows/ci.yml,title=Windows contract test output::$tail"
            exit $code
          }
      - name: Smoke the packed npm package on Windows
        shell: bash
        run: node scripts/npm-package-smoke.mjs --cache "$(npm config get cache)"
      - name: Compile and execute-smoke the native baseline standalone
        if: ${{ !cancelled() && steps.windows-build.outcome == 'success' }}
        shell: bash
        run: |
          bun scripts/build-binary.ts dist/bin/hara
          expected="$(node -p 'require("./package.json").version')"
          test -f dist/bin/hara.exe
          set +e
          output="$(node scripts/standalone-boundary-smoke.mjs dist/bin/hara.exe "$expected" 2>&1)"
          code=$?
          set -e
          printf '%s\n' "$output"
          if [[ "$code" -ne 0 ]]; then
            summary="$(printf '%s\n' "$output" | tail -n 80)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error file=scripts/standalone-boundary-smoke.mjs,title=Windows native standalone smoke::$summary"
            exit "$code"
          fi
          node scripts/standalone-serve-smoke.mjs dist/bin/hara.exe "$expected"
          node scripts/standalone-coding-runtime-smoke.mjs dist/bin/hara.exe "$expected"
          node scripts/standalone-pi-runtime-smoke.mjs dist/bin/hara.exe "$expected"

  complete-default-suite:
    # Candidate-equivalent full coverage, including the strict original-deadline native batches.
    # Full output must survive a failure; a tail alone cannot identify the first failed fixture.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.1"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
          bun-download-url: ${{ matrix.os == 'windows-latest' && 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip' || '' }}
      - run: npm ci
      - name: Record native fixture file-identity precision
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs";import os from "node:os";const n=fs.lstatSync(os.tmpdir()),b=fs.lstatSync(os.tmpdir(),{bigint:true});console.log(JSON.stringify({platform:process.platform,arch:process.arch,dev:String(b.dev),ino:String(b.ino),safeNumberDev:Number.isSafeInteger(n.dev),safeNumberIno:Number.isSafeInteger(n.ino)}));'
      - name: Complete platform full suite with failure diagnostics
        shell: bash
        run: |
          set +e
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            node scripts/native-ci-tests.mjs --original-deadlines 2>&1 | tee "$RUNNER_TEMP/core-default-tests.log"
            test_code=${PIPESTATUS[0]}
          else
            npm test 2>&1 | tee "$RUNNER_TEMP/core-default-tests.log"
            test_code=${PIPESTATUS[0]}
          fi
          exit "$test_code"
      - name: Retain complete test diagnostics on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-default-tests-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/core-default-tests.log
          if-no-files-found: warn
          retention-days: 7

  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build the complete runtime image
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if docker build --tag hara-ci .; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Docker runtime build failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Docker runtime build attempt ${attempt} failed; retrying after $((attempt * 10))s" >&2
            sleep "$((attempt * 10))"
          done
      - name: Start the guarded entry point
        run: docker run --rm hara-ci --version

  standalone-runtime:
    # Intel's full durable-I/O suite is required; heavy fixtures run serially, not skipped.
    timeout-minutes: ${{ matrix.os == 'macos-15-intel' && 35 || 20 }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
          - os: macos-15
            target: bun-darwin-arm64
          - os: macos-15-intel
            target: bun-darwin-x64-baseline
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.1"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - run: npm ci
      - name: Run the full suite on both real release-class Mac architectures before tag
        if: ${{ startsWith(matrix.os, 'macos-') }}
        shell: bash
        run: node scripts/native-ci-tests.mjs
      - name: Compile and execute the native standalone binary
        shell: bash
        run: |
          bun --version
          npm run build
          bun scripts/build-binary.ts dist/bin/hara "${{ matrix.target }}"
          expected="$(node -p 'require("./package.json").version')"
          actual="$(./dist/bin/hara --version)"
          [[ "$actual" == "$expected" ]] || { echo "standalone version mismatch: $actual != $expected" >&2; exit 1; }
          ./dist/bin/hara --help >/dev/null
          node scripts/standalone-boundary-smoke.mjs ./dist/bin/hara "$expected"
          node scripts/standalone-serve-smoke.mjs ./dist/bin/hara "$expected"
          node scripts/standalone-coding-runtime-smoke.mjs ./dist/bin/hara "$expected"
          node scripts/standalone-pi-runtime-smoke.mjs ./dist/bin/hara "$expected"
      - name: Smoke the packed npm package on the native platform
        shell: bash
        run: node scripts/npm-package-smoke.mjs --cache "$(npm config get cache)"
