name: Core 1.3.1 Linux release probe
on:
  push:
    branches: [probe/core-131-linux-20261126]
permissions:
  contents: read
jobs:
  linux-binaries:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64-baseline
            asset: hara-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: hara-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 20a5d93f6b3ee9b0f70394bcb444a4ec0541c8e5
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.1"
      - name: Verify the candidate source and MCP executable input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == push ]]
          [[ "$GITHUB_REF" == "refs/heads/probe/core-131-linux-20261126" ]]
          head=$(git rev-parse HEAD)
          [[ "$head" == 20a5d93f6b3ee9b0f70394bcb444a4ec0541c8e5 ]]
          dirty=$(git status --porcelain --untracked-files=all)
          [[ -z "$dirty" ]]
          [[ "$(node -p 'require("./package.json").version')" == 1.3.1 ]]
          [[ "$(node --version)" == v22.23.1 ]]
          printf 'source=%s node=%s architecture=%s\n' "$head" "$(node --version)" "$(uname -m)"
          case "${{ matrix.target }}" in
            bun-linux-x64-baseline) [[ "$(uname -m)" == x86_64 ]] ;;
            bun-linux-arm64) [[ "$(uname -m)" == aarch64 ]] ;;
            *) exit 1 ;;
          esac
          node_path=$(node -p 'require("node:fs").realpathSync(process.execPath)')
          attributes=$(stat -Lc '%a %h %s' -- "$node_path")
          read -r mode links size <<< "$attributes"
          [[ -f "$node_path" && "$mode" =~ ^[0-7]{3,4}$ && "$links" == 1 && "$size" =~ ^[0-9]+$ ]]
          printf 'mode=%s nlink=%s size=%s\n' "$mode" "$links" "$size"
          (( (8#$mode & 8#022) == 0 && size > 0 && size <= 268435456 ))
          bun --version
      - run: npm ci
      - name: Audit production dependencies
        run: bash .github/scripts/audit-production.sh
      - run: npm test
      - name: Build the native Linux release asset
        shell: bash
        run: |
          bun scripts/build-binary.ts "dist/bin/${{ matrix.asset }}" "${{ matrix.target }}"
      - name: Execute the native Linux release asset before assembly
        shell: bash
        run: |
          asset="dist/bin/${{ matrix.asset }}"
          expected="$(node -p 'require("./package.json").version')"
          actual="$("$asset" --version)"
          [[ "$actual" == "$expected" ]] || { echo "standalone version mismatch: $actual != $expected" >&2; exit 1; }
          "$asset" --help >/dev/null
          node scripts/standalone-boundary-smoke.mjs "$asset" "$expected"
          node scripts/standalone-serve-smoke.mjs "$asset" "$expected"
          node scripts/standalone-coding-runtime-smoke.mjs "$asset" "$expected"
          node scripts/standalone-pi-runtime-smoke.mjs "$asset" "$expected"
      - name: Record the disposable binary digest
        run: sha256sum "dist/bin/${{ matrix.asset }}"
