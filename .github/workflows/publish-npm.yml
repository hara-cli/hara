# Publish @nanhara/hara to npm. Fires on a version tag push (v*) — so "release to GitHub" (push a tag, or cut a
# GitHub Release, which creates the tag) also ships to npm — plus a manual "Run workflow" button. Publishing uses
# npm Trusted Publishing (GitHub OIDC), so the workflow never stores or receives a long-lived npm write token.
# The @nanhara/hara package must trust hara-cli/hara + publish-npm.yml and allow direct `npm publish`.
#
# Idempotent: if package.json's version is already on npm, the run exits green ("nothing to publish") instead of
# failing — so re-runs and dispatch-tests are safe, and a green run still proves OIDC authentication succeeded.
name: publish-npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Reuse the same native/Windows/Docker checks that protect main. Keep OIDC publication in this
  # workflow's publish job so the npm Trusted Publishing identity does not move to the reusable CI.
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - name: Use an npm CLI with Trusted Publishing support
        run: npm install --global npm@12.1.0
      - name: Verify the token-free OIDC environment
        shell: bash
        run: |
          [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]] || { echo "GitHub OIDC is unavailable" >&2; exit 1; }
          [[ -z "${NODE_AUTH_TOKEN:-}" ]] || { echo "refusing token auth in the Trusted Publishing job" >&2; exit 1; }
      - name: Verify tag matches the package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "npm tag mismatch: $GITHUB_REF_NAME != $expected" >&2; exit 1; }
      - run: npm ci
      - name: Audit production dependencies
        run: bash .github/scripts/audit-production.sh
      - run: npm test
      - name: Smoke the packed npm package before upload
        shell: bash
        run: node scripts/npm-package-smoke.mjs --cache "$(npm config get cache)" --pack-destination "$RUNNER_TEMP/hara-verified-package"
      - name: Publish to npm (idempotent)
        run: |
          verified_tarball="$(node scripts/npm-package-smoke.mjs --verify-retained "$RUNNER_TEMP/hara-verified-package")"
          set +e
          out=$(npm publish "$verified_tarball" --ignore-scripts --registry https://registry.npmjs.org/ 2>&1); code=$?
          echo "$out"
          if [ $code -eq 0 ]; then echo "✓ published"; exit 0; fi
          if echo "$out" | grep -qiE "cannot publish over|previously published|EPUBLISHCONFLICT|409 Conflict"; then
            echo "✓ auth OK — this version is already on npm; nothing to publish"; exit 0
          fi
          echo "✗ publish failed (auth or other error above)"; exit 1
