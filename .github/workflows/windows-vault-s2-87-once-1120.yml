          # Retain actual exit codes and bounded compiler/package error identifiers.
          function Invoke-Build([string]$Command, [string[]]$Arguments, [string]$Label) {
            $codes = [Collections.Generic.HashSet[string]]::new()
            & $Command @Arguments 2>&1 | ForEach-Object {
              foreach ($match in [regex]::Matches([string]$_, '\b(?:TS[0-9]{4}|E[0-9]{4}|ENOTCACHED|EINTEGRITY|ENOENT|ERESOLVE|EBADPLATFORM|ELIFECYCLE)\b')) {
                if ($codes.Count -lt 16) { $null = $codes.Add($match.Value) }
              }
            }
            $code = $LASTEXITCODE
            Write-Host ("{0} exit={1} codes={2}" -f $Label, $code, (($codes | Sort-Object) -join ','))
            if ($code -ne 0) { throw "Failed fixed stage $Label" }
          }
          if ((& node --version) -cne 'v22.23.1' -or (& bun --version) -cne '1.3.9' -or
              (& node -p 'process.platform + "/" + process.arch') -cne 'win32/x64') {
            throw 'Unexpected runtime versions or architecture'
          }
          $env:NPM_CONFIG_USERCONFIG = Join-Path $env:S2_ROOT 'empty-user.npmrc'
          $env:NPM_CONFIG_GLOBALCONFIG = Join-Path $env:S2_ROOT 'empty-global.npmrc'
          $env:NPM_CONFIG_UPDATE_NOTIFIER = 'false'
          Invoke-Build 'rustup' @('toolchain','install','1.92.0','--profile','minimal','--target','x86_64-pc-windows-msvc') 'rustup'
          Invoke-Build 'npm.cmd' @('ci','--ignore-scripts','--no-audit','--no-fund',
            '--registry=https://registry.npmjs.org/', '--cache',(Join-Path $env:S2_ROOT 'npm-cache')) 'npm-ci'
          Invoke-Build 'node' @('--input-type=module','-e','import {transformSync} from "esbuild"; if (!transformSync("let n: number = 1",{loader:"ts"}).code) process.exit(1)') 'esbuild'
          Invoke-Build 'npm.cmd' @('run','build') 'core-build'
          Invoke-Build 'node' @('scripts/build-windows-vault-worker.mjs') 'dpapi-worker'
          Invoke-Build 'rustc' @('+1.92.0','--edition=2021','--target=x86_64-pc-windows-msvc','--test',
            'native/windows-credential-worker/main.rs','-o',(Join-Path $env:S2_FIXTURES 'vault-native-tests.exe')) 'native-suite'
          Invoke-Build 'rustc' @('+1.92.0','--edition=2021','--target=x86_64-pc-windows-msvc',
            (Join-Path $env:S2_FIXTURES 'native-fixture.rs'),
            '-o',(Join-Path $env:S2_FIXTURES 's2-fixture.exe')) 'fixture'
          Invoke-Build 'npm.cmd' @('pack','--ignore-scripts','--pack-destination',(Join-Path $env:S2_ROOT 'pack')) 'npm-pack'
          $archives = @(Get-ChildItem -LiteralPath (Join-Path $env:S2_ROOT 'pack') -Filter '*.tgz' -File)
          if ($archives.Count -ne 1) { throw 'Expected a single npm tarball' }
          $npmEntry = Join-Path $env:S2_CORE 'npm-entry'
          New-Item -ItemType Directory -Path $npmEntry | Out-Null
          Invoke-Build 'tar.exe' @('-xf',$archives[0].FullName,'-C',$npmEntry) 'npm-extract'
          Invoke-Build 'bun' @('scripts/build-binary.ts','dist/bin/hara.exe','bun-windows-x64-baseline',
            'dist/cli.js','desktop-sidecar') 'bun-sidecar'
          $built = Join-Path $env:S2_CORE 'dist/native/win32-x64/hara-credential-worker.exe'
          $packed = Join-Path $npmEntry 'package/dist/native/win32-x64/hara-credential-worker.exe'
          $bundled = Join-Path $env:S2_CORE 'dist/bin/hara-credential-worker.exe'
          $expected = (Get-FileHash -LiteralPath $built).Hash
          if ((Get-FileHash -LiteralPath $packed).Hash -cne $expected -or
              (Get-FileHash -LiteralPath $bundled).Hash -cne $expected -or
              !(Test-Path -LiteralPath (Join-Path $env:S2_CORE 'dist/bin/hara.exe') -PathType Leaf)) {
            throw 'The npm and sidecar workers must match the pinned build'
          }
          $node = (Get-Command node.exe -CommandType Application).Source
          Copy-Item -LiteralPath $node -Destination (Join-Path $env:S2_ROOT 'tools/node.exe')
          'S2_BUILT=true' >> $env:GITHUB_ENV

      - name: Enforce the isolated fixture firewall rules
        id: private_network
        timeout-minutes: 2
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = Join-Path $env:S2_FIXTURES 'drive.ps1'
          & pwsh -NoProfile -NonInteractive -File $driver -Phase Prepare -Root $env:S2_ROOT -Core $env:S2_CORE -Evidence $env:S2_EVIDENCE *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Owned loopback-only network guard held' }

      - name: 1. save-restart-rotate-revoke in Node npm and Bun
        id: case1
        timeout-minutes: 5
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = Join-Path $env:S2_FIXTURES 'drive.ps1'
          & pwsh -NoProfile -NonInteractive -File $driver -Phase Case1 -Root $env:S2_ROOT -Core $env:S2_CORE -Evidence $env:S2_EVIDENCE *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Node or Bun credential roundtrip held; see sanitized receipt' }

      - name: 2. same-Host queue and external store.lock
        id: case2
        timeout-minutes: 4
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = Join-Path $env:S2_FIXTURES 'drive.ps1'
          & pwsh -NoProfile -NonInteractive -File $driver -Phase Case2 -Root $env:S2_ROOT -Core $env:S2_CORE -Evidence $env:S2_EVIDENCE *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Queue or retry acceptance held; see sanitized receipt' }

      - name: 3. post-write pre-publish crash and recovery
        id: case3
        timeout-minutes: 4
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = Join-Path $env:S2_FIXTURES 'drive.ps1'
          & pwsh -NoProfile -NonInteractive -File $driver -Phase Case3 -Root $env:S2_ROOT -Core $env:S2_CORE -Evidence $env:S2_EVIDENCE *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Crash recovery acceptance held; see sanitized receipt' }

      - name: 4. native namespace, junction, ACL and temporary quota
        id: case4
        timeout-minutes: 4
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = Join-Path $env:S2_FIXTURES 'drive.ps1'
          & pwsh -NoProfile -NonInteractive -File $driver -Phase Case4 -Root $env:S2_ROOT -Core $env:S2_CORE -Evidence $env:S2_EVIDENCE *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Native negative acceptance held; see sanitized receipt' }

      - name: 5. read-only handshake and public log safety
        id: case5
        timeout-minutes: 3
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = Join-Path $env:S2_FIXTURES 'drive.ps1'
          & pwsh -NoProfile -NonInteractive -File $driver -Phase Case5 -Root $env:S2_ROOT -Core $env:S2_CORE -Evidence $env:S2_EVIDENCE *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Handshake or disclosure acceptance held; see sanitized receipt' }

      - name: Clean owned fixtures and seal public receipt
        id: seal
        if: ${{ always() && steps.embed.outcome == 'success' }}
        timeout-minutes: 4
        env:
          S2_CASE1_OUTCOME: ${{ steps.case1.outcome }}
          S2_CASE2_OUTCOME: ${{ steps.case2.outcome }}
          S2_CASE3_OUTCOME: ${{ steps.case3.outcome }}
          S2_CASE4_OUTCOME: ${{ steps.case4.outcome }}
          S2_CASE5_OUTCOME: ${{ steps.case5.outcome }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $driver = Join-Path $env:S2_FIXTURES 'drive.ps1'
          & pwsh -NoProfile -NonInteractive -File $driver -Phase Finalize -Root $env:S2_ROOT -Core $env:S2_CORE -Evidence $env:S2_EVIDENCE *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Public receipt could not be sealed' }

      - name: Validate the public receipt before upload
        id: public_receipt
        if: ${{ always() && steps.seal.outcome == 'success' }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $receiptPath = Join-Path $env:S2_EVIDENCE 'receipt.json'
          $validator = @'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const file = process.argv[2];
          const stat = fs.lstatSync(file);
          assert(stat.isFile() && stat.size <= 16384);
          const r = JSON.parse(fs.readFileSync(file, 'utf8'));
          const exactKeys = (object, keys) => assert.deepEqual(Object.keys(object).sort(), keys.split(' ').sort());
          const equalOrNull = (value, expected) => assert(value === null || value === expected);
          const sha256 = value => typeof value === 'string' && /^[a-f0-9]{64}$/.test(value);
          const status = value => ['pass', 'fail', 'hold', 'skipped'].includes(value);
          const count = value => value === null || Number.isSafeInteger(value) && value >= 0 && value <= 10000;
          exactKeys(r, 'schemaVersion sourceSha sourceTree probeSha runId runAttempt runnerImage runnerImageVersion arch node bun rust lockSha256 workerSourceSha256 workerSha256 npmWorkerSha256 sidecarWorkerSha256 bunSidecarSha256 cases handshakeExtraProcesses modelCalls providerCalls cleanup qualification');
          assert.equal(r.schemaVersion, 1);
          assert.equal(r.sourceSha, process.env.S2_SOURCE_SHA);
          assert.equal(r.sourceTree, process.env.S2_SOURCE_TREE);
          assert.equal(r.probeSha, process.env.GITHUB_SHA);
          assert.equal(r.runId, process.env.GITHUB_RUN_ID);
          assert.equal(r.runAttempt, 1);
          assert.equal(r.runnerImage, 'windows-2025');
          assert.equal(r.arch, 'x64');
          assert(r.runnerImageVersion === null || typeof r.runnerImageVersion === 'string' && /^\d{8}(?:\.\d+){1,4}$/.test(r.runnerImageVersion));
          equalOrNull(r.node, 'v22.23.1');
          equalOrNull(r.bun, '1.3.9');
          equalOrNull(r.rust, '1.92.0');
          equalOrNull(r.lockSha256, process.env.S2_LOCK_SHA256);
          equalOrNull(r.workerSourceSha256, process.env.S2_WORKER_SOURCE_SHA256);
          for (const digest of [r.workerSha256, r.npmWorkerSha256, r.sidecarWorkerSha256, r.bunSidecarSha256]) {
            assert(digest === null || sha256(digest));
          }
          exactKeys(r.cases, 'case1 case2 case3 case4 case5');
          const { case1, case2, case3, case4, case5 } = r.cases;
          exactKeys(case1, 'status nodeNpm bunSidecar currentUserIsolation');
          const cases = [case1.status, case1.nodeNpm, case1.bunSidecar, case2, case3, case4, case5];
          for (const state of cases) {
            assert(status(state));
          }
          assert(case1.currentUserIsolation === null || typeof case1.currentUserIsolation === 'boolean');
          assert(count(r.modelCalls) && count(r.providerCalls));
          exactKeys(r.handshakeExtraProcesses, 'nodeReadOnly bunReadOnly nodeSave bunSave');
          for (const value of Object.values(r.handshakeExtraProcesses)) assert(count(value));
          assert(['confirmed', 'unconfirmed', 'skipped'].includes(r.cleanup));
          assert(['pass', 'fail', 'hold'].includes(r.qualification));
          if (r.qualification === 'pass') {
            assert(cases.every(state => state === 'pass') && case1.currentUserIsolation === true);
            assert(r.modelCalls === 0 && r.providerCalls === 0 && r.cleanup === 'confirmed');
            assert.deepEqual(r.handshakeExtraProcesses, { nodeReadOnly: 0, bunReadOnly: 0, nodeSave: 1, bunSave: 1 });
            assert(sha256(r.workerSha256) && r.workerSha256 === r.npmWorkerSha256 && r.workerSha256 === r.sidecarWorkerSha256);
            assert(sha256(r.bunSidecarSha256) && r.runnerImageVersion !== null && r.node && r.bun && r.rust);
          }
          '@
          $validator | & node - $receiptPath *> $null
          if ($LASTEXITCODE -ne 0) { throw 'Public receipt failed allowlist validation' }

      - name: Retain only sanitized evidence
        if: ${{ always() && steps.public_receipt.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-vault-s2-87-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.S2_EVIDENCE }}/receipt.json
          if-no-files-found: error
          retention-days: 3

      - name: Require complete acceptance and cleanup
        if: ${{ always() && steps.public_receipt.outcome == 'success' }}
        run: |
          $receiptPath = Join-Path $env:S2_EVIDENCE 'receipt.json'
          try { $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json -ErrorAction Stop }
          catch { throw 'Invalid public receipt' }
          if ($receipt.qualification -cne 'pass') { throw 'Windows acceptance or cleanup incomplete' }
