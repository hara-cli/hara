name: windows-vault-s2-87-once-1120
on:
  push:
    branches:
      - probe/windows-vault-s2-87-once-1120

permissions:
  contents: read

concurrency:
  group: windows-vault-s2-87-once-1120
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

env:
  S2_SOURCE_SHA: '1c2e7e94905f2d336a7846a00c411022b9c63bea'
  S2_SOURCE_TREE: '29e6cfd1ec9a7a371eb35d5e929aaea62dca8351'
  S2_LOCK_SHA256: '8f2a126d1cf3c7458d3c156c2eb3365195f914ba95d98c0d0183848da805bc07'
  S2_WORKER_SOURCE_SHA256: '063fa83cceb3bca3f82973ed5e5b454bde066011fd22470d8859d967de0b7dc0'
  S2_FIXTURE_DRIVE_SHA256: '94e32adccfdf0c57f6503dc47acbf438ef4a54b9d0ae7a7e52d77dbff97534e6'
  S2_FIXTURE_VERIFY_SHA256: '31c87727cc3f289d22577ee51adf6c4ad24392eb4e1c37c47a8fc69dd1d357f2'
  S2_FIXTURE_OBSERVE_SHA256: '30807eb02265d034ad014a3a623e5d342976d24757a5a033d1447e502e799df1'
  S2_FIXTURE_NATIVE_SHA256: 'b7ae64656312f470aa89af470dd912bf81ce00c2b70f3f0b43aeb43a4b36b3ad'

jobs:
  native-s2:
    if: >-
      github.repository == 'hara-cli/hara' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/probe/windows-vault-s2-87-once-1120' &&
      github.event.created == true && github.event.deleted == false &&
      github.run_attempt == '1'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out the admitted probe commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind runner and both immutable trees
        id: admit
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or
              $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA) {
            throw 'Runner or workflow identity mismatch'
          }
          $head = @(& git rev-list --parents -n 1 HEAD 2>$null)
          if ($LASTEXITCODE -ne 0 -or $head.Count -ne 1 -or
              $head[0] -cne "$env:GITHUB_SHA $env:S2_SOURCE_SHA") {
            throw 'Expected probe commit with the single pinned Core parent'
          }
          $tree = @(& git rev-parse "$($env:S2_SOURCE_SHA)^{tree}" 2>$null)
          if ($LASTEXITCODE -ne 0 -or $tree.Count -ne 1 -or $tree[0] -cne $env:S2_SOURCE_TREE) {
            throw 'Pinned Core tree mismatch'
          }
          $actual = @(& git diff --name-status --no-renames $env:S2_SOURCE_SHA HEAD 2>$null)
          if ($LASTEXITCODE -ne 0 -or $actual.Count -ne 1 -or
              $actual[0] -cne ("A" + [char]9 + '.github/workflows/windows-vault-s2-87-once-1120.yml')) {
            throw 'Probe child must add exactly its workflow file'
          }
          $nonce = [Guid]::NewGuid().ToString("N").Substring(0, 16)
          $root = Join-Path $env:RUNNER_TEMP "hara-s2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$nonce"
          if (Test-Path -LiteralPath $root) { throw 'Fixture root already exists' }
          New-Item -ItemType Directory -Path $root | Out-Null
          foreach ($name in @('core', 'pack', 'evidence', 'fixtures', 'cases', 'control', 'tools')) {
            New-Item -ItemType Directory -Path (Join-Path $root $name) | Out-Null
          }
          "S2_ROOT=$root" >> $env:GITHUB_ENV
          "S2_CORE=$(Join-Path $root 'core')" >> $env:GITHUB_ENV
          "S2_EVIDENCE=$(Join-Path $root 'evidence')" >> $env:GITHUB_ENV
          "S2_FIXTURES=$(Join-Path $root 'fixtures')" >> $env:GITHUB_ENV

      - name: Assemble drive.ps1 part 1
        run: |
          $source = @'
          param(
            [Parameter(Mandatory)][ValidateSet('Prepare','Case1','Case2','Case3','Case4','Case5','Finalize')][string]$Phase,
            [Parameter(Mandatory)][string]$Root,
            [Parameter(Mandatory)][string]$Core,
            [Parameter(Mandatory)][string]$Evidence
          )
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          Set-StrictMode -Version Latest
          $Root = [IO.Path]::GetFullPath($Root)
          $Core = [IO.Path]::GetFullPath($Core)
          $Evidence = [IO.Path]::GetFullPath($Evidence)
          $parent = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $leaf = [IO.Path]::GetFileName($Root)
          $runPrefix = "hara-s2-$env:GITHUB_RUN_ID-1-"
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:GITHUB_REPOSITORY -cne 'hara-cli/hara' -or $env:GITHUB_RUN_ATTEMPT -cne '1' -or
              $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ARCH -cne 'X64' -or
              [IO.Path]::GetDirectoryName($Root) -ine $parent -or
              $leaf -cnotmatch ('^' + [regex]::Escape($runPrefix) + '[a-f0-9]{16}$') -or
              $Core -ine (Join-Path $Root 'core') -or $Evidence -ine (Join-Path $Root 'evidence') -or
              (Get-Item -LiteralPath $Root -Force).Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) { exit 90 }

          $fixture = Join-Path $Root 'fixtures/s2-fixture.exe'
          $control = Join-Path $Root 'control'
          $ledger = Join-Path $control 'firewall.json'
          $phaseNames = @('round-node','round-bun','queue','crash','native','handshake-node',
                          'handshake-bun','calibrate-node','calibrate-bun')
          $allowedPoints = @('identity','round-node','round-bun','queue','retry','uncertain','live-drain',
            'crash','post-write-crash','live-crash','native','junction','acl','pending-quota',
            'handshake-node','handshake-bun','calibrate-node','calibrate-bun')
          $worker = Join-Path $Core 'dist/native/win32-x64/hara-credential-worker.exe'
          $npmWorker = Join-Path $Core 'npm-entry/package/dist/native/win32-x64/hara-credential-worker.exe'
          $bunWorker = Join-Path $Core 'dist/bin/hara-credential-worker.exe'
          $bunSidecar = Join-Path $Core 'dist/bin/hara.exe'
          $programs = @((Join-Path $Root 'tools/node.exe'), $bunSidecar, $npmWorker, $bunWorker,
            $fixture, (Join-Path $Root 'fixtures/vault-native-tests.exe'))
          $programs = @($programs | ForEach-Object { [IO.Path]::GetFullPath($_) })
          $addresses = @('0.0.0.0-127.0.0.0', '127.0.0.2-255.255.255.255', '::/0')
          $utf8 = [Text.UTF8Encoding]::new($false, $true)

          function Write-Json([string]$File, $Value) {
            [IO.File]::WriteAllText($File, ($Value | ConvertTo-Json -Depth 10 -Compress) + [char]10, $utf8)
          }
          function Read-Json([string]$File, [int]$Limit = 16384) {
            $item = Get-Item -LiteralPath $File -Force
            if ($item.PSIsContainer -or $item.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint) -or $item.Length -gt $Limit) {
              throw 'Invalid fixed receipt file'
            }
            $text = [IO.File]::ReadAllText($item.FullName, $utf8)
            if ($text.Length -gt $Limit) { throw 'Fixed receipt grew' }
            return (ConvertFrom-Json -InputObject $text -AsHashtable -ErrorAction Stop)
          }
          function Hash-IfFile([string]$File) {
            if (Test-Path -LiteralPath $File -PathType Leaf) {
              return (Get-FileHash -LiteralPath $File -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            return $null
          }
          function Valid-Count($Value, [int]$Maximum) {
            return (($Value -is [int] -or $Value -is [long]) -and $Value -ge 0 -and $Value -le $Maximum)
          }
          function Names-ForNetwork {
            for ($i = 0; $i -lt $programs.Count; $i++) { "$leaf-out-$i" }
          }
          function Check-Network {
            if (@(Get-NetFirewallProfile -PolicyStore ActiveStore | Where-Object Enabled -ne 'True').Count -ne 0) {
              throw 'Firewall profile disabled'
            }
            $names = @(Names-ForNetwork)
            for ($i = 0; $i -lt $programs.Count; $i++) {
              $rule = Get-NetFirewallRule -Name $names[$i] -PolicyStore ActiveStore -ErrorAction Stop
              $program = $rule | Get-NetFirewallApplicationFilter
              $range = $rule | Get-NetFirewallAddressFilter
              if ($rule.Group -cne $leaf -or $rule.Enabled -ne 'True' -or $rule.Direction -ne 'Outbound' -or
                  $rule.Action -ne 'Block' -or $program.Program -ine $programs[$i] -or
                  @(Compare-Object ($addresses | Sort-Object) ($range.RemoteAddress | Sort-Object)).Count -ne 0) {
                throw 'Effective fixture firewall rule differs'
              }
            }
          }
          function Enable-NetworkGuard {
            $names = @(Names-ForNetwork)
            foreach ($program in $programs) {
              $file = Get-Item -LiteralPath $program -Force
              if ($file.PSIsContainer -or $file.Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) { throw 'Invalid owned fixture program' }
            }
            # Record exact rule identities before any firewall change.
            Write-Json $ledger $names
            for ($i = 0; $i -lt $programs.Count; $i++) {
              $parameters = @{
                Name = $names[$i]; DisplayName = $names[$i]; Group = $leaf; Enabled = 'True'
                Direction = 'Outbound'; Action = 'Block'; Program = $programs[$i]; RemoteAddress = $addresses; Profile = 'Any'
              }
              New-NetFirewallRule @parameters | Out-Null
            }
            Check-Network
          }
          function Remove-NetworkGuard {
            if (!(Test-Path -LiteralPath $ledger)) { return }
            $expected = @(Names-ForNetwork)
            $recorded = @(Read-Json $ledger)
            if (($expected -join ',') -cne ($recorded -join ',')) { throw 'Firewall ledger identity differs' }
            foreach ($name in $expected) {
              $rule = Get-NetFirewallRule -Name $name -PolicyStore PersistentStore -ErrorAction SilentlyContinue
              if ($null -ne $rule) {
                if ($rule.Group -cne $leaf) { throw 'Firewall rule identity differs' }
                Remove-NetFirewallRule -Name $name -PolicyStore PersistentStore -ErrorAction Stop
              }
              if (Get-NetFirewallRule -Name $name -PolicyStore ActiveStore -ErrorAction SilentlyContinue) {
                throw 'Active fixture firewall rule retained'
              }
            }
          }

          function Read-Phase([string]$Name) {
            $candidate = Join-Path $control "$Name/outcome.json"
            $private = Join-Path $Root "cases/$Name/verdict.json"
            $status = 'skipped'
            $outcome = $null
            $verdict = $null
            if (Test-Path -LiteralPath (Join-Path $control $Name)) {
              $status = 'hold'
              if (Test-Path -LiteralPath $candidate) { $outcome = Read-Json $candidate }
              if (Test-Path -LiteralPath $private) { $verdict = Read-Json $private }
              if ($null -ne $outcome -and $null -ne $verdict -and
                  $outcome.clean -is [bool] -and $outcome.clean -and
                  $outcome.drained -is [bool] -and $outcome.drained -and
                  (Valid-Count $outcome.code 255) -and (Valid-Count $outcome.total 10000) -and $outcome.total -ge 1 -and
                  $verdict.point -cin $allowedPoints -and $verdict.scrubbed -is [bool] -and
                  $verdict.removed -is [bool] -and $verdict.result -cin @('pass','fail')) {
                $status = 'fail'
                if ($outcome.code -eq 0 -and $verdict.result -ceq 'pass' -and $verdict.scrubbed -and
                    $verdict.removed -and (Valid-Count $verdict.providerCalls 1000) -and
                    (Valid-Count $verdict.modelCalls 1000) -and $verdict.providerCalls -eq 0 -and $verdict.modelCalls -eq 0) {
                  $status = 'pass'
                }
              }
            }
            return @{ status = $status; outcome = $outcome; verdict = $verdict }
          }
          function Run-Phase([string]$Name, [int]$Milliseconds) {
            Check-Network
            & $fixture 'supervise' $Root $Name $Milliseconds *> $null
            if ($LASTEXITCODE -ne 0) { return $false }
            return ((Read-Phase $Name).status -ceq 'pass')
          }
          function Combine-Status($Values) {
            if ('fail' -cin $Values) { return 'fail' }
            if ('hold' -cin $Values) { return 'hold' }
            if ('skipped' -cin $Values) {
              if (@($Values | Where-Object { $_ -cne 'skipped' }).Count -gt 0) { return 'hold' }
              return 'skipped'
            }
            return 'pass'
          }
          function Worker-Count($PhaseResult) {
            # Verifier Node, production Host and two native identity checks are expected.
            # Miscellaneous or concealed launches fail the threshold as well.
            if ($PhaseResult.status -ceq 'pass' -and $PhaseResult.outcome.total -ge 4) {
              return ($PhaseResult.outcome.total - 4)
            }
            return $null
          }
          function Seal-Receipt {
            $data = @{}
            foreach ($name in $phaseNames) { $data[$name] = Read-Phase $name }
            $isolation = $null
            $nodeTrial = $data['round-node']
            if ($null -ne $nodeTrial.outcome -and $nodeTrial.outcome.isolation -is [bool]) {
              $isolation = $nodeTrial.outcome.isolation
            }
            $normalizedStatus = $nodeTrial.status
            if ($normalizedStatus -ceq 'pass' -and $isolation -ne $true) { $normalizedStatus = 'fail' }
            $case1 = [ordered]@{
              status = (Combine-Status @($normalizedStatus, $data['round-bun'].status))
              nodeNpm = $normalizedStatus
              bunSidecar = $data['round-bun'].status
              currentUserIsolation = $isolation
            }
            $case5 = Combine-Status @($data['handshake-node'].status, $data['handshake-bun'].status,
              $data['calibrate-node'].status, $data['calibrate-bun'].status)
            $workers = [ordered]@{ nodeReadOnly = (Worker-Count $data['handshake-node']); bunReadOnly = (Worker-Count $data['handshake-bun'])
              nodeSave = (Worker-Count $data['calibrate-node']); bunSave = (Worker-Count $data['calibrate-bun']) }
            if ($case5 -ceq 'pass' -and ($null -eq $workers.nodeReadOnly -or $workers.nodeReadOnly -ne 0 -or
                $null -eq $workers.bunReadOnly -or $workers.bunReadOnly -ne 0 -or
                $workers.nodeSave -ne 1 -or $workers.bunSave -ne 1)) { $case5 = 'fail' }
            $cases = [ordered]@{
              case1 = $case1; case2 = $data['queue'].status; case3 = $data['crash'].status
              case4 = $data['native'].status; case5 = $case5
            }
            $models = 0
            $providers = 0
            $allMeasured = $true
            $allOwnedClean = $true
            foreach ($name in $phaseNames) {
              $pair = $data[$name]
              if ($null -eq $pair.verdict -or !(Valid-Count $pair.verdict.modelCalls 1000) -or
                  !(Valid-Count $pair.verdict.providerCalls 1000)) {
                $allMeasured = $false
              } else {
                $models += $pair.verdict.modelCalls
                $providers += $pair.verdict.providerCalls
              }
              if ($pair.status -cne 'skipped' -and ($null -eq $pair.outcome -or $pair.outcome.clean -ne $true -or
                  $pair.outcome.drained -ne $true -or $null -eq $pair.verdict -or $pair.verdict.removed -ne $true)) {
                $allOwnedClean = $false
              }
            }
            $image = $env:ImageVersion
            if ($image -cnotmatch '^\d{8}(?:\.\d+){1,4}$') { $image = $null }
            $nodeVersion = $null
            $bunVersion = $null
            $rustVersion = $null
            if ($env:S2_BUILT -ceq 'true') { $nodeVersion = 'v22.23.1'; $bunVersion = '1.3.9'; $rustVersion = '1.92.0' }
            $receipt = [ordered]@{
              schemaVersion = 1
              sourceSha = $env:S2_SOURCE_SHA
              sourceTree = $env:S2_SOURCE_TREE
              probeSha = $env:GITHUB_SHA
              runId = $env:GITHUB_RUN_ID
              runAttempt = 1
              runnerImage = 'windows-2025'
              runnerImageVersion = $image
              arch = 'x64'
              node = $nodeVersion; bun = $bunVersion; rust = $rustVersion
              lockSha256 = (Hash-IfFile (Join-Path $Core 'package-lock.json'))
              workerSourceSha256 = (Hash-IfFile (Join-Path $Core 'native/windows-credential-worker/main.rs'))
              workerSha256 = (Hash-IfFile $worker)
              npmWorkerSha256 = (Hash-IfFile $npmWorker)
              sidecarWorkerSha256 = (Hash-IfFile $bunWorker)
              bunSidecarSha256 = (Hash-IfFile $bunSidecar)
              cases = $cases
              handshakeExtraProcesses = $workers
              modelCalls = $(if ($allMeasured) { $models } else { $null })
              providerCalls = $(if ($allMeasured) { $providers } else { $null })
              cleanup = 'unconfirmed'
              qualification = 'hold'
            }
            try {
              Remove-NetworkGuard
              if ($allOwnedClean) {
                # Work only on the exact, newly allocated job tree. The public receipt is outside this set.
                foreach ($subdir in @('cases','core','pack','tools','npm-cache','fixtures')) {
                  $target = Join-Path $Root $subdir
                  if (Test-Path -LiteralPath $target) {
                    if ((Get-Item -LiteralPath $target -Force).Attributes.HasFlag([IO.FileAttributes]::ReparsePoint)) {
                      throw 'Unexpected cleanup link'
                    }
                    Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction Stop
                    if (Test-Path -LiteralPath $target) { throw 'Fixture cleanup incomplete' }
                  }
                }
                $archive = Join-Path $Root 'core.tar'
                if (Test-Path -LiteralPath $archive -PathType Leaf) { Remove-Item -LiteralPath $archive -Force }
                $receipt.cleanup = 'confirmed'
              }
            } catch {
              # Preserve the failure classification. The ephemeral hosted VM retires as a fallback.
            }
            $workflowCases = @($env:S2_CASE1_OUTCOME, $env:S2_CASE2_OUTCOME, $env:S2_CASE3_OUTCOME,
              $env:S2_CASE4_OUTCOME, $env:S2_CASE5_OUTCOME)
            $status = Combine-Status @($case1.status, $cases.case2, $cases.case3, $cases.case4, $cases.case5)
            if ($status -ceq 'fail' -or 'failure' -cin $workflowCases -or
                ($allMeasured -and ($models -ne 0 -or $providers -ne 0))) {
              $receipt.qualification = 'fail'
            } elseif ($env:S2_BUILT -ceq 'true' -and $allMeasured -and $status -ceq 'pass' -and
                @($workflowCases | Where-Object { $_ -ceq 'success' }).Count -eq 5 -and
                $receipt.cleanup -ceq 'confirmed' -and $null -ne $image -and
                $null -ne $receipt.workerSha256 -and $receipt.workerSha256 -ceq $receipt.npmWorkerSha256 -and
                $receipt.workerSha256 -ceq $receipt.sidecarWorkerSha256 -and $null -ne $receipt.bunSidecarSha256) {
              $receipt.qualification = 'pass'
            }
            Write-Json (Join-Path $Evidence 'receipt.json') $receipt
          }

          try {
            switch ($Phase) {
              'Prepare' { Enable-NetworkGuard }
              'Case1' {
                $nodePassed = Run-Phase 'round-node' 105000
                $bunPassed = Run-Phase 'round-bun' 105000
                if (!$nodePassed -or !$bunPassed -or (Read-Phase 'round-node').outcome.isolation -ne $true) { exit 1 }
              }
              'Case2' { if (!(Run-Phase 'queue' 155000)) { exit 1 } }
              'Case3' { if (!(Run-Phase 'crash' 150000)) { exit 1 } }
              'Case4' { if (!(Run-Phase 'native' 135000)) { exit 1 } }
              'Case5' {
                foreach ($name in @('handshake-node','handshake-bun','calibrate-node','calibrate-bun')) {
                  if (!(Run-Phase $name 28000)) { exit 1 }
                }
                if ((Worker-Count (Read-Phase 'handshake-node')) -ne 0 -or (Worker-Count (Read-Phase 'handshake-bun')) -ne 0 -or
          '@
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          $expressionStart = [string]::Concat([char]36, '{{')
          if ($source.Contains($expressionStart) -or $source -match "(?m)^'@") { throw 'Invalid fixture delimiter' }
          $source = ($source -replace '\r\n?', [string][char]10) + [char]10
          $file = Join-Path $env:S2_FIXTURES 'drive.ps1'
          if (Test-Path -LiteralPath $file) { throw 'Fixture target already exists' }
          [IO.File]::WriteAllText($file, $source, $utf8)

      - name: Assemble drive.ps1 part 2
        run: |
          $source = @'
                    (Worker-Count (Read-Phase 'calibrate-node')) -ne 1 -or (Worker-Count (Read-Phase 'calibrate-bun')) -ne 1) { exit 1 }
              }
              'Finalize' { Seal-Receipt }
            }
            exit 0
          } catch {
            # No dynamic value may reach workflow logs. A missing verdict is reported as unconfirmed.
            exit 91
          }
          '@
          $utf8 = [Text.UTF8Encoding]::new($false, $true)
          $expressionStart = [string]::Concat([char]36, '{{')
          if ($source.Contains($expressionStart) -or $source -match "(?m)^'@") { throw 'Invalid fixture delimiter' }
          $source = ($source -replace '\r\n?', [string][char]10) + [char]10
          $file = Join-Path $env:S2_FIXTURES 'drive.ps1'
          if ((Get-Item -LiteralPath $file).Length -ne 13878) { throw 'Fixture chunk offset differs' }
          [IO.File]::AppendAllText($file, $source, $utf8)

      - name: Assemble verify.mjs part 1
        run: |
          $source = @'
          // Runs as the ordinary disposable Windows account. Its only durable output is a fixed form verdict.
          import { spawn, spawnSync } from "node:child_process";
          import { createDecipheriv, createHash, randomBytes } from "node:crypto";
          import { once } from "node:events";
          import fs from "node:fs";
          import { createServer } from "node:http";
          import { createRequire } from "node:module";
          import path from "node:path";
          import { setTimeout as sleep } from "node:timers/promises";
          import { pathToFileURL } from "node:url";

          process.on("uncaughtException", () => process.exit(93));
          process.on("unhandledRejection", () => process.exit(93));

          function prove(value, label) {
            if (!value) throw new Error(label);
          }
          const [root, scratch, phase] = process.argv.slice(2);
          const phases = ["round-node", "round-bun", "queue", "crash", "native",
            "handshake-node", "handshake-bun", "calibrate-node", "calibrate-bun"];
          prove(process.platform === "win32" && process.arch === "x64" && phases.includes(phase), "fixture platform");
          prove(path.resolve(scratch) === path.resolve(root, "cases", phase), "fixture root");
          const core = path.join(root, "core");
          const fixtures = path.join(root, "fixtures");
          const native = path.join(fixtures, "s2-fixture.exe");
          const npmRoot = path.join(core, "npm-entry", "package");
          const npmWorker = path.join(npmRoot, "dist", "native", "win32-x64", "hara-credential-worker.exe");
          const bun = path.join(core, "dist", "bin", "hara.exe");
          const bunWorker = path.join(path.dirname(bun), "hara-credential-worker.exe");
          const wsRequire = createRequire(path.join(core, "package.json"));
          const { WebSocket } = wsRequire("ws");
          const load = relative => import(pathToFileURL(path.join(core, "dist", "workspace", relative)).href);
          const { AsyncWindowsDpapiCredentialVault } = await load("windows-credential-vault.js");
          const { canonical } = await load("local-state.js");
          const hostProgram = process.execPath;
          const baseEnv = Object.fromEntries(["SystemRoot", "WINDIR", "LOCALAPPDATA", "APPDATA",
            "USERPROFILE", "TEMP", "TMP", "PATH"].map(name => [name, process.env[name]]));
          const sensitive = new Set([scratch, process.env.USERPROFILE, process.env.S2_EXPECT_SID]);
          const output = [];
          const ownChildren = new Set();
          let observedBytes = 0;
          let localData;
          let sink;
          let providerCalls = 0;
          let listening = false;
          let point = "identity";
          let result = "fail";

          function sha(bytes) { return createHash("sha256").update(bytes).digest("hex"); }
          function read(file, limit) {
            const info = fs.lstatSync(file);
            prove(info.isFile() && info.size <= limit, "bounded file");
            const bytes = fs.readFileSync(file);
            prove(bytes.length <= limit, "bounded growth");
