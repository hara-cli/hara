          // This preload only wraps the pinned, real v2 worker spawned by a fixture Node Host.
          import childProcess from "node:child_process";
          import { syncBuiltinESMExports } from "node:module";
          import fs from "node:fs";
          import path from "node:path";

          const dir = process.env.S2_OBSERVE;
          const worker = process.env.S2_EXPECT_WORKER;
          if (process.platform !== "win32" || !dir || !worker || !path.isAbsolute(dir) || !path.isAbsolute(worker)) {
            throw new Error("S2 observer requires the isolated Windows test Host");
          }
          const expected = fs.realpathSync.native(worker).toLowerCase();
          const originalSpawn = childProcess.spawn;
          const list = ["normal", "hold-read", "retry-slow", "lose-ack", "hold-ack", "hold-live"];
          let sequence = 0;
          const used = new Set();
          const modePath = path.join(dir, "mode.json");
          const events = path.join(dir, "events.jsonl");

          function mode() {
            const stat = fs.lstatSync(modePath);
            if (!stat.isFile() || stat.size > 256) throw new Error("Invalid S2 observer control");
            const value = JSON.parse(fs.readFileSync(modePath, "utf8"));
            if (!/^[a-z0-9-]{1,32}$/.test(value.ticket) || !list.includes(value.action)) {
              throw new Error("Invalid S2 observer control");
            }
            return value;
          }

          function gate(file, perform) {
            const deadline = performance.now() + 60_000;
            const handle = setInterval(() => {
              if (fs.existsSync(file)) {
                clearInterval(handle);
                perform();
              } else if (performance.now() >= deadline) {
                clearInterval(handle);
                process.exit(91);
              }
            }, 10);
          }

          childProcess.spawn = function (program, ...args) {
            if (typeof program !== "string" || path.basename(program).toLowerCase() !== "hara-credential-worker.exe") {
              return originalSpawn.call(this, program, ...args);
            }
            if (fs.realpathSync.native(program).toLowerCase() !== expected) throw new Error("Unexpected S2 worker");
            const control = mode();
            const id = ++sequence;
            const child = originalSpawn.call(this, program, ...args);
            const write = (stage, data = {}) => fs.appendFileSync(events, JSON.stringify({
              ticket: control.ticket, id, stage, time: performance.now(), ...data,
            }) + "\n");
            const release = name => path.join(dir, control.ticket + "-" + name);
            const end = child.stdin.end.bind(child.stdin);
            const emit = child.emit.bind(child);
            const kill = child.kill.bind(child);
            let held = false;
            let op;
            let sent = false;
            let amount = 0;
            const header = Buffer.alloc(27);
            let nonce;
            child.once("spawn", () => write("spawn", { pid: child.pid }));
            child.stdin.end = (frame, complete) => {
              if (!Buffer.isBuffer(frame) || frame.length < 59 || frame.toString("ascii", 4, 8) !== "HVQ2") {
                throw new Error("Unexpected S2 request frame");
              }
              op = frame[8];
              nonce = Buffer.from(frame.subarray(9, 25));
              const run = () => {
                if (child.stdin.destroyed) return;
                sent = true;
                write("frame", { op });
                end(frame, complete);
              };
              const hold = (control.action === "hold-read" && op === 1) || (control.action === "hold-live" && op === 2);
              if (hold && !used.has(control.ticket)) {
                used.add(control.ticket);
                held = true;
                write("held-input", { op, pid: child.pid });
                if (control.action === "hold-read") gate(release("input"), run);
                return child.stdin;
              }
              run();
              return child.stdin;
            };
            child.kill = signal => {
              if (held && control.action === "hold-live") {
                write("stop-requested");
                return false;
              }
              return kill(signal);
            };
            child.stdout.on("data", chunk => {
              if (amount < header.length) chunk.copy(header, amount, 0, Math.min(chunk.length, header.length - amount));
              amount += chunk.length;
            });
            child.emit = (event, ...values) => {
              if (event !== "close") return emit(event, ...values);
              const [exitCode, exitSignal] = values;
              const valid = sent && nonce && !exitSignal && exitCode === 0 && amount >= 27 && amount <= 65_600
                && header.readUInt32LE(0) === amount - 4 && header.toString("ascii", 4, 8) === "HVR2"
                && header.subarray(8, 24).equals(nonce);
              const status = valid ? header[24] : null;
              header.fill(0);
              nonce?.fill(0);
