name: windows-vault-probe
# Temporary, manually enabled probe. No publication, signing credentials, model calls or release jobs.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed S1 source commit (40 hex characters)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: windows-vault-probe
  cancel-in-progress: false
jobs:
  native-canary:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      HARA_WINDOWS_VAULT_CANARY: '1'
      PROBE_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate fixed source SHA
        shell: pwsh
        run: |
          if ($env:PROBE_SOURCE_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Exact source SHA required' }
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
          bun-download-url: 'https://github.com/oven-sh/bun/releases/download/bun-v1.3.9/bun-windows-x64-baseline.zip'
      - name: Install fixed minimal native toolchain (runner only)
        run: rustup toolchain install 1.92.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Reuse locked dependencies and compile TypeScript
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          exit $LASTEXITCODE
      - name: Build native worker and actual second-user tests
        run: |
          node scripts/build-windows-vault-worker.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc +1.92.0 --edition=2021 --target=x86_64-pc-windows-msvc --test native/windows-credential-worker/main.rs -o "$env:RUNNER_TEMP/vault-native-tests.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/vault-native-tests.exe" --test-threads=1 2>&1 | Tee-Object "$env:RUNNER_TEMP/vault-native-tests.log"
          exit $LASTEXITCODE
      - name: Exercise Node, real DPAPI, native ACL/reparse and package boundaries
        run: |
          node --test --test-concurrency=1 test/windows-credential-vault.test.mjs 2>&1 | Tee-Object "$env:RUNNER_TEMP/vault-node-tests.log"
          exit $LASTEXITCODE
      - name: Exercise actual packed npm module path
        run: |
          node scripts/windows-vault-package-canary.mjs 2>&1 | Tee-Object "$env:RUNNER_TEMP/vault-npm-tests.log"
          exit $LASTEXITCODE
      - name: Compile real standalone and compiled adapter with sibling resource
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/build-binary.ts dist/bin/hara bun-windows-x64-baseline
          bun scripts/build-binary.ts dist/bin/vault-canary bun-windows-x64-baseline scripts/windows-vault-bun-canary.mjs desktop-sidecar
          node scripts/standalone-boundary-smoke.mjs dist/bin/hara.exe "$(node -p 'require("./package.json").version')"
          node scripts/standalone-serve-smoke.mjs dist/bin/hara.exe "$(node -p 'require("./package.json").version')"
          dist/bin/vault-canary.exe | tee "$RUNNER_TEMP/vault-bun-tests.log"
      - name: Record exact source, toolchains and worker integrity
        if: ${{ always() }}
        shell: pwsh
        run: |
          $manifest = 'dist/native/win32-x64/manifest.json'
          $receipt = [ordered]@{ schemaVersion=1; sourceSha=$env:PROBE_SOURCE_SHA; actualSha=(git rev-parse HEAD); runner=$env:RUNNER_OS; arch=$env:RUNNER_ARCH; node=(node --version); bun=(bun --version); jobStatus='${{ job.status }}'; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; productionHostEnabled=$false; modelCalls=0 }
          if (Test-Path $manifest) { $receipt.worker = (Get-Content $manifest -Raw | ConvertFrom-Json) }
          $receipt | ConvertTo-Json -Depth 8 | Set-Content "$env:RUNNER_TEMP/vault-receipt.json"
      - name: Retain bounded synthetic test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-vault-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vault-*.log
            ${{ runner.temp }}/vault-receipt.json
          if-no-files-found: warn
          retention-days: 7
